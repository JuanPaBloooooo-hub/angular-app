
<div class="contenedor">

  <h2>Operaciones CRUD</h2>

  <table>
    <thead>
      <tr>
        <th>Imagen</th>
        <th>Título</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      @for (producto of productos(); track producto.id) {
        <tr>
          <td>
            <img
              [src]="producto.image"
              [alt]="producto.title"
            >
          </td>

          <td>{{ producto.title }}</td>

          <td>{{ producto.category }}</td>

          <td>
            <button class="borrar">Borrar</button>
            <button class="actualizar">Actualizar</button>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>

<!-- CREATE y UPDATE: formulario -->
    <div class="col-lg-4">
      <h2>{{ editingId() === null ? 'Nuevo producto' : 'Editar producto #' + editingId() }}</h2>


      <form (ngSubmit)="save()">
        <label for="title">Título</label>
        <input id="title" name="title" class="form-control mb-3" [(ngModel)]="form.title" required />


        <label for="price">Precio</label>
        <input id="price" name="price" type="number" min="0" step="0.01" class="form-control mb-3"
          [(ngModel)]="form.price" required />


        <label for="category">Categoría</label>
        <select id="category" name="category" class="form-select mb-3" [(ngModel)]="form.category" required>
          <option value="">Selecciona una categoría</option>
          @for (category of categories(); track category) {
            <option [value]="category">{{ category }}</option>
          }
        </select>


        <label for="image">URL de la imagen</label>
        <input id="image" name="image" type="url" class="form-control mb-3" [(ngModel)]="form.image" required />


        <label for="description">Descripción</label>
        <textarea id="description" name="description" rows="3" class="form-control mb-3"
          [(ngModel)]="form.description"></textarea>


        <button type="submit" class="btn btn-primary w-100">Guardar</button>


        @if (editingId() !== null) {
          <button type="button" class="btn btn-outline-secondary w-100 mt-2" (click)="cancel()">Cancelar</button>
        }
      </form>
    </div>
