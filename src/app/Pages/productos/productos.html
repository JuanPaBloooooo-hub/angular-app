<div class="carrusel-item d-flex flex-wrap justify-content-center gap-3">
  @for (producto of productos(); track producto.id) {
    <div class="card h-100 shadow-sm" style="width: 18rem;">
      <!-- Imagen del producto -->
      <img [src]="producto.image" [alt]="producto.title" class="card-img-top p-3" style="height: 200px; object-fit: contain;">
      
      <div class="card-body d-flex flex-column text-center">
        <div>
          <span class="badge bg-secondary mb-2 text-capitalize">{{ producto.category }}</span>
          <h5 class="card-title text-truncate mb-2" [title]="producto.title">{{ producto.title }}</h5>
        </div>
        
        <div class="mt-auto">
          <p class="text-success fw-bold fs-5 mb-1">${{ producto.price }}</p>
          <small class="text-muted d-block">
             {{ producto.rating.rate }} ({{ producto.rating.count }} reseñas)
          </small>
        </div>
      </div>
    </div>
  }
</div>
